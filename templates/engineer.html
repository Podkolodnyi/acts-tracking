{% extends 'base.html' %}

{% block title %}Выбор инженера{% endblock %}

{% block content %}
<div class="card" style="max-width:620px;margin:50px auto">
  <h1>Кто работает?</h1>
  <p class="muted">
    Выберите себя. Имя будет указано исполнителем во всех новых актах.
  </p>

  <form method="post">
    <div class="grid two">
      {% for key, item in engineers.items() %}
      <button class="btn btn-primary"
              name="engineer_key"
              value="{{ key }}">
        {{ item.name }} · № {{ item.code }}
      </button>
      {% endfor %}
    </div>
  </form>
</div>
{% endblock %}
