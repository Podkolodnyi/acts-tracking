{% extends 'base.html' %}

{% block title %}Выбор инженера{% endblock %}

{% block content %}
<h1>Выберите инженера</h1>

<p>Выберите себя. Имя будет указано исполнителем во всех новых актах.</p>

<form method="POST" action="{{ url_for('engineer_select') }}">
    <div class="form-group">
        <label for="engineer_key">Инженер:</label>
        <select name="engineer_key" id="engineer_key" required>
            <option value="">— Выберите из списка —</option>
            <option value="podkolodny">Подколодный</option>
            <option value="dzyuba">Дзюба</option>
            <option value="izyurov">Изъюров</option>
            <option value="ozerov">Озеров</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Продолжить</button>
</form>
{% endblock %}
